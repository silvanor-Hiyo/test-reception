<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>受付 - 永和物産 食品展示会2026</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root {
  --navy: #0d1f5c;
  --navy-mid: #1a3a9e;
  --gold: #c8a84b;
  --gold-light: #e8cc80;
  --gold-pale: #f7f0dc;
  --cream: #faf7f0;
  --white: #ffffff;
  --text: #1a1a2e;
  --text-light: #6b6b8a;
  --border: #ddd5be;
  --success: #1a6e35;
  --success-bg: #e8f7ed;
  --warning-bg: #fff8e1;
  --warning: #92400e;
  --error: #8b1a1a;
  --error-bg: #fdf0f0;
  --radius: 14px;
  --shadow: 0 4px 20px rgba(13,31,92,0.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 40px;
}

/* ===== ヘッダー ===== */
.header {
  background: linear-gradient(160deg, #1a3a9e 0%, #0d1f5c 100%);
  border-bottom: 3px solid var(--gold);
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(13,31,92,0.4);
}
.header-left { display: flex; flex-direction: column; gap: 2px; }
.header-label { font-size: 10px; letter-spacing: 3px; color: var(--gold-light); font-weight: 600; }
.header-title { font-size: 18px; font-weight: 700; color: white; }
.header-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.08);
  padding: 6px 12px; border-radius: 20px;
  border: 1px solid rgba(200,168,75,0.3);
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #4caf50; box-shadow: 0 0 6px #4caf50;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

main { max-width: 560px; margin: 0 auto; padding: 20px 16px; }

/* ===== カード ===== */
.card {
  background: var(--white); border-radius: var(--radius);
  padding: 24px 20px; margin-bottom: 16px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.card::before {
  content: ''; position: absolute;
  top: 0; left: 20px; right: 20px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.5;
}
.card-title {
  font-size: 15px; font-weight: 700; color: var(--navy);
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}

/* ===== カメラエリア（オーバーレイ方式） ===== */
.camera-wrap {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
  border: 2px solid var(--gold);
  box-shadow: var(--shadow);
  background: #000;
  display: none;
}
.camera-wrap.active { display: block; }

.camera-header {
  background: var(--navy);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.camera-title {
  font-size: 14px; font-weight: 700; color: var(--gold-light);
  display: flex; align-items: center; gap: 8px;
}
.camera-status {
  font-size: 11px; color: rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.08);
  padding: 4px 10px; border-radius: 12px;
}
.camera-status.scanning { color: #4caf50; background: rgba(76,175,80,0.15); }
.camera-status.paused { color: var(--gold-light); background: rgba(200,168,75,0.15); }

#qr-reader { width: 100%; background: #000; }
#qr-reader video { width: 100% !important; max-height: 300px; object-fit: cover; }
#qr-reader__scan_region { background: transparent !important; }
#qr-reader__scan_region img { display: none !important; }
#qr-reader__dashboard { display: none !important; }

.camera-guide {
  background: rgba(0,0,0,0.6);
  padding: 10px 16px; text-align: center;
  font-size: 13px; color: rgba(255,255,255,0.8);
}

/* ===== オーバーレイ（カメラの上に重ねる結果画面） ===== */
.overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
  animation: fadeIn 0.3s ease;
}
.overlay.show { display: flex; }
.overlay.preview { background: rgba(13,31,92,0.92); }
.overlay.success { background: rgba(26,110,53,0.93); }
.overlay.duplicate { background: rgba(146,64,14,0.93); }
.overlay.error { background: rgba(139,26,26,0.93); }
.overlay.loading { background: rgba(13,31,92,0.85); }

@keyframes fadeIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }

.overlay-icon { font-size: 52px; margin-bottom: 10px; }
.overlay-name { font-size: 24px; font-weight: 700; color: white; margin-bottom: 6px; text-align: center; }
.overlay-company { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 8px; text-align: center; line-height: 1.5; }
.overlay-message { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.9); text-align: center; }
.overlay-time { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 6px; }

.overlay-buttons {
  display: flex; gap: 10px; margin-top: 20px; width: 100%;
}
.overlay-buttons .btn { flex: 1; }

/* ===== カメラ起動ボタン ===== */
.btn-camera-start {
  width: 100%; padding: 20px;
  background: linear-gradient(135deg, var(--navy), var(--navy-mid));
  color: var(--gold-light); border: 2px solid var(--gold);
  border-radius: var(--radius);
  font-size: 17px; font-weight: 700; font-family: inherit;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin-bottom: 16px; box-shadow: var(--shadow); transition: all 0.2s;
}
.btn-camera-start .icon { font-size: 32px; }
.camera-stop-btn {
  background: var(--navy); padding: 10px 16px;
  text-align: center;
}

/* ===== ボタン ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 13px 20px; border: none; border-radius: 10px;
  font-size: 15px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gold) 0%, #b8922e 100%);
  color: var(--navy); box-shadow: 0 2px 8px rgba(200,168,75,0.3);
}
.btn-danger { background: linear-gradient(135deg, #e53935, #c62828); color: white; }
.btn-outline { background: rgba(255,255,255,0.15); color: white; border: 1.5px solid rgba(255,255,255,0.4); }
.btn-outline-dark { background: transparent; color: var(--navy-mid); border: 1.5px solid var(--border); }
.btn-success { background: linear-gradient(135deg, #2e7d32, #1a6e35); color: white; }
.btn-block { width: 100%; }

/* ===== 手動入力 ===== */
.manual-row { display: flex; gap: 8px; }
.input-field {
  flex: 1; padding: 12px 14px; border: 1.5px solid var(--border);
  border-radius: 10px; font-size: 15px; font-family: inherit;
  color: var(--text); outline: none; transition: border-color 0.2s;
  -webkit-appearance: none;
}
.input-field:focus { border-color: var(--navy-mid); }
.input-field::placeholder { color: #bbb8d0; font-size: 13px; }

/* ===== 受付ログ ===== */
.log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.log-count {
  background: var(--gold-pale); color: var(--navy);
  font-size: 12px; font-weight: 700; padding: 4px 10px;
  border-radius: 20px; border: 1px solid rgba(200,168,75,0.3);
}
.log-list { display: flex; flex-direction: column; gap: 8px; }
.log-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; background: var(--cream);
  border-radius: 10px; border: 1px solid var(--border);
}
.log-time { font-size: 12px; color: var(--text-light); white-space: nowrap; min-width: 42px; }
.log-info { flex: 1; min-width: 0; }
.log-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-company { font-size: 12px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-badge { font-size: 10px; padding: 3px 8px; border-radius: 6px; background: var(--success-bg); color: var(--success); font-weight: 700; white-space: nowrap; }
.log-empty { text-align: center; padding: 24px; color: var(--text-light); font-size: 14px; }

/* ===== スピナー ===== */
.spinner {
  display: inline-block; width: 40px; height: 40px;
  border: 4px solid rgba(255,255,255,0.2);
  border-top-color: white; border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-bottom: 12px;
}
@keyframes spin { to{transform:rotate(360deg)} }

/* ===== トースト ===== */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--navy); color: white;
  padding: 12px 24px; border-radius: 30px;
  font-size: 14px; font-weight: 600;
  border: 1px solid var(--gold);
  box-shadow: 0 4px 20px rgba(13,31,92,0.3);
  z-index: 999; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ===== OCR紙読み取りモーダル ===== */
.ocr-modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(13,31,92,0.85);
  z-index: 200;
  overflow-y: auto;
  padding: 20px 16px 40px;
}
.ocr-modal-overlay.show { display: block; }

.ocr-modal {
  max-width: 520px;
  margin: 0 auto;
  background: var(--white);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(13,31,92,0.4);
}

.ocr-modal-header {
  background: linear-gradient(135deg, var(--navy), var(--navy-mid));
  border-bottom: 2px solid var(--gold);
  padding: 18px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.ocr-modal-title { font-size: 16px; font-weight: 700; color: var(--gold-light); display: flex; align-items: center; gap: 8px; }
.ocr-close-btn {
  background: rgba(255,255,255,0.15); border: none; color: white;
  width: 32px; height: 32px; border-radius: 50%;
  font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}

.ocr-modal-body { padding: 24px 20px; }

/* 撮影エリア */
.ocr-shoot-area {
  text-align: center;
  margin-bottom: 20px;
}
.ocr-preview-img {
  width: 100%; max-height: 200px; object-fit: contain;
  border-radius: 10px; border: 2px solid var(--border);
  display: none; margin-bottom: 12px;
}
.ocr-preview-img.show { display: block; }

.ocr-shoot-btn {
  width: 100%; padding: 18px;
  background: linear-gradient(135deg, #1a3a9e, #0d1f5c);
  color: white; border: 2px dashed var(--gold);
  border-radius: var(--radius);
  font-size: 16px; font-weight: 700; font-family: inherit;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: all 0.2s;
}
.ocr-shoot-btn:active { transform: scale(0.98); }

.ocr-status-bar {
  display: none;
  align-items: center; gap: 10px;
  padding: 12px 16px;
  background: var(--gold-pale);
  border-radius: 10px;
  border: 1px solid rgba(200,168,75,0.4);
  margin-bottom: 16px;
  font-size: 13px; font-weight: 600; color: var(--navy);
}
.ocr-status-bar.show { display: flex; }
.ocr-spinner {
  width: 20px; height: 20px;
  border: 3px solid rgba(13,31,92,0.2);
  border-top-color: var(--navy);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}

/* OCR結果フォーム */
.ocr-form { display: none; }
.ocr-form.show { display: block; }

.ocr-form-title {
  font-size: 13px; font-weight: 700; color: var(--navy);
  padding: 10px 14px;
  background: var(--success-bg);
  border-radius: 8px;
  border-left: 3px solid var(--success);
  margin-bottom: 16px;
}

.ocr-field { margin-bottom: 14px; }
.ocr-label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-light); margin-bottom: 5px;
}
.ocr-label .req { color: #c0392b; margin-left: 3px; }
.ocr-input {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: 10px; font-size: 15px; font-family: inherit;
  color: var(--text); outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.ocr-input:focus { border-color: var(--navy-mid); box-shadow: 0 0 0 3px rgba(26,58,158,0.08); }
.ocr-input.ocr-filled { background: #f0fdf4; border-color: #86efac; }

.ocr-row { display: flex; gap: 10px; }
.ocr-row .ocr-field { flex: 1; }

.ocr-form-actions {
  display: flex; gap: 10px; margin-top: 20px;
}
.ocr-form-actions .btn { flex: 1; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-label">EIWA BUSSAN 2026</div>
    <div class="header-title">来場者受付</div>
  </div>
  <div class="header-status">
    <div class="status-dot"></div>
    <span id="checkinCountBadge">本日 0名</span>
  </div>
</div>

<main>

  <!-- ===== カメラ起動ボタン ===== -->
  <button class="btn-camera-start" id="startBtn" onclick="startCamera()">
    <span class="icon">📷</span>
    <span>カメラを起動してQRをスキャン</span>
  </button>

  <!-- ===== カメラ＋オーバーレイ ===== -->
  <div class="camera-wrap" id="cameraWrap">

    <div class="camera-header">
      <div class="camera-title"><span>📷</span> QRコードをスキャン中</div>
      <div class="camera-status scanning" id="cameraStatus">スキャン待機中</div>
    </div>

    <div id="qr-reader"></div>

    <div class="camera-guide" id="cameraGuide">
      お客様の入場証QRコードをカメラに向けてください
    </div>

    <div class="overlay" id="overlay">
      <div class="overlay-icon" id="overlayIcon"></div>
      <div class="overlay-name" id="overlayName"></div>
      <div class="overlay-company" id="overlayCompany"></div>
      <div class="overlay-message" id="overlayMessage"></div>
      <div class="overlay-time" id="overlayTime"></div>
      <div class="overlay-buttons" id="overlayButtons" style="display:none;">
        <button class="btn btn-danger" onclick="cancelCheckin()">❌ キャンセル</button>
        <button class="btn btn-primary" onclick="confirmCheckin()">✅ 受付する</button>
      </div>
      <div id="overlayNext" style="display:none; margin-top:16px; width:100%;">
        <button class="btn btn-outline btn-block" onclick="resetScan()">次の受付へ →</button>
      </div>
    </div>

    <div class="camera-stop-btn">
      <button class="btn btn-outline-dark btn-block" onclick="stopCamera()" style="font-size:13px;padding:10px;">
        カメラを停止する
      </button>
    </div>
  </div>

  <!-- ===== 手動入力 ===== -->
  <div class="card">
    <div class="card-title"><span>⌨️</span>手動入力（QR読めない場合）</div>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:12px;">
      来場者IDを直接入力して受付できます（例：V-ABC123）
    </p>
    <div class="manual-row">
      <input type="text" class="input-field" id="manualId"
        placeholder="V-XXXXXX"
        style="font-family:monospace;text-transform:uppercase;"
        onkeydown="if(event.key==='Enter') manualCheckin()">
      <button class="btn btn-primary" onclick="manualCheckin()">受付</button>
    </div>
  </div>

  <!-- ===== 紙OCR新規登録（新規追加） ===== -->
  <div class="card">
    <div class="card-title"><span>📋</span>紙カードを読み取って新規登録</div>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:16px;">
      QRコードをお持ちでないお客様の登録カードを撮影して、その場で登録・受付できます。
    </p>
    <button class="btn btn-outline-dark btn-block" onclick="openOcrModal()" style="padding:16px;font-size:15px;border-color:var(--gold);color:var(--navy);">
      📸　登録カードを撮影して登録する
    </button>
  </div>

  <!-- ===== 受付ログ ===== -->
  <div class="card">
    <div class="log-header">
      <div class="card-title" style="margin:0"><span>📋</span>本日の受付記録</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="log-count" id="logCount">0名</span>
        <button class="btn btn-outline-dark" onclick="loadCheckins()" style="padding:6px 12px;font-size:12px;">更新</button>
      </div>
    </div>
    <div class="log-list" id="logList">
      <div class="log-empty">まだ受付記録がありません</div>
    </div>
  </div>

</main>

<!-- ===== OCR モーダル ===== -->
<div class="ocr-modal-overlay" id="ocrModalOverlay">
  <div class="ocr-modal">

    <div class="ocr-modal-header">
      <div class="ocr-modal-title">📋 登録カード読み取り</div>
      <button class="ocr-close-btn" onclick="closeOcrModal()">✕</button>
    </div>

    <div class="ocr-modal-body">

      <!-- 撮影エリア -->
      <div class="ocr-shoot-area">
        <img id="ocrPreviewImg" class="ocr-preview-img" alt="撮影画像プレビュー">
        <button class="ocr-shoot-btn" id="ocrShootBtn" onclick="triggerOcrCamera()">
          <span style="font-size:28px;">📷</span>
          <span id="ocrShootLabel">カードを撮影する</span>
        </button>
        <!-- hidden file input（カメラ起動用） -->
        <input type="file" id="ocrFileInput" accept="image/*" capture="environment"
          style="display:none;" onchange="onOcrImageSelected(event)">
      </div>

      <!-- 読み取り中ステータス -->
      <div class="ocr-status-bar" id="ocrStatusBar">
        <div class="ocr-spinner"></div>
        <span id="ocrStatusText">Gemini AIが読み取り中です…少々お待ちください</span>
      </div>

      <!-- OCR結果フォーム -->
      <div class="ocr-form" id="ocrForm">
        <div class="ocr-form-title">✅ 読み取り完了！内容を確認・修正してから登録してください</div>

        <div class="ocr-field">
          <label class="ocr-label">会社名・店舗名<span class="req">★必須</span></label>
          <input type="text" class="ocr-input" id="ocr_company" placeholder="例：山田商店">
        </div>

        <div class="ocr-field">
          <label class="ocr-label">部署名</label>
          <input type="text" class="ocr-input" id="ocr_department" placeholder="例：仕入部">
        </div>

        <div class="ocr-row">
          <div class="ocr-field">
            <label class="ocr-label">ふりがな</label>
            <input type="text" class="ocr-input" id="ocr_furigana" placeholder="やまだたろう">
          </div>
          <div class="ocr-field">
            <label class="ocr-label">氏名<span class="req">★必須</span></label>
            <input type="text" class="ocr-input" id="ocr_name" placeholder="山田 太郎">
          </div>
        </div>

        <div class="ocr-field">
          <label class="ocr-label">メールアドレス</label>
          <input type="email" class="ocr-input" id="ocr_email" placeholder="例：yamada@example.com">
        </div>

        <div class="ocr-field">
          <label class="ocr-label">電話番号</label>
          <input type="tel" class="ocr-input" id="ocr_phone" placeholder="例：03-1234-5678">
        </div>

        <div class="ocr-row">
          <div class="ocr-field" style="flex:0 0 140px;">
            <label class="ocr-label">郵便番号</label>
            <input type="text" class="ocr-input" id="ocr_zip" placeholder="123-4567">
          </div>
          <div class="ocr-field">
            <label class="ocr-label">住所</label>
            <input type="text" class="ocr-input" id="ocr_address" placeholder="東京都渋谷区…">
          </div>
        </div>

        <div class="ocr-field">
          <label class="ocr-label">宛名（カタログ送付先）</label>
          <input type="text" class="ocr-input" id="ocr_store_to" placeholder="山田 太郎">
        </div>

        <div class="ocr-form-actions">
          <button class="btn btn-outline-dark" onclick="resetOcrForm()">📷 撮り直す</button>
          <button class="btn btn-success" onclick="submitOcrRegistration()">✅ 登録して受付する</button>
        </div>
      </div><!-- /ocr-form -->

    </div><!-- /ocr-modal-body -->
  </div><!-- /ocr-modal -->
</div><!-- /ocr-modal-overlay -->

<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzu01ilMhbcurDDW8Y7ZdW8IQaf54k3qVoCGfGcueOZWcMUKiFSWQH1bj3Ic-CB4ZLdIg/exec';

let html5QrCode = null;
let isScanning = false;
let scanPaused = false;
let lastScannedId = null;
let scanCooldown = false;

// ============================================================
// カメラ起動・停止
// ============================================================
function startCamera() {
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('cameraWrap').classList.add('active');

  html5QrCode = new Html5Qrcode('qr-reader');

  const config = {
    fps: 20,
    qrbox: { width: 280, height: 280 },
    aspectRatio: 1.0,
    disableFlip: false,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  };

  html5QrCode.start(
    { facingMode: 'environment' },
    config,
    onQrSuccess,
    () => {}
  ).then(() => {
    isScanning = true;
    scanPaused = false;
    setStatus('scanning', 'スキャン待機中');
  }).catch(err => {
    showToast('カメラの起動に失敗しました');
    document.getElementById('startBtn').style.display = 'flex';
    document.getElementById('cameraWrap').classList.remove('active');
  });
}

function stopCamera() {
  hideOverlay();
  if (html5QrCode && isScanning) {
    html5QrCode.stop().then(() => {
      isScanning = false;
      html5QrCode = null;
    });
  }
  document.getElementById('cameraWrap').classList.remove('active');
  document.getElementById('startBtn').style.display = 'flex';
}

function setStatus(type, text) {
  const el = document.getElementById('cameraStatus');
  el.textContent = text;
  el.className = 'camera-status ' + type;
}

// ============================================================
// QRスキャン成功
// ============================================================
function onQrSuccess(decodedText) {
  if (scanCooldown || scanPaused) return;
  scanCooldown = true;
  setTimeout(() => { scanCooldown = false; }, 3000);

  let visitorId = '';
  try {
    const url = new URL(decodedText);
    visitorId = url.searchParams.get('id') || '';
  } catch(e) {
    visitorId = decodedText.trim().toUpperCase();
  }

  if (!visitorId) { showToast('QRコードを認識できませんでした'); return; }

  scanPaused = true;
  if (html5QrCode) { try { html5QrCode.pause(true); } catch(e) {} }
  setStatus('paused', '確認中...');

  showOverlayLoading();
  lastScannedId = visitorId;

  fetch(GAS_URL + '?action=getVisitorInfo&visitorId=' + encodeURIComponent(visitorId))
    .then(r => r.json())
    .then(data => {
      if (!data.success) {
        showOverlayError('来場者が見つかりません', 'ID: ' + visitorId);
        return;
      }
      showOverlayPreview(data.visitor);
    })
    .catch(() => {
      showOverlayError('通信エラー', 'インターネット接続を確認してください');
    });
}

// ============================================================
// オーバーレイ表示
// ============================================================
function showOverlayLoading() {
  const ov = document.getElementById('overlay');
  ov.className = 'overlay loading show';
  document.getElementById('overlayIcon').innerHTML = '<div class="spinner"></div>';
  document.getElementById('overlayName').textContent = '確認中...';
  document.getElementById('overlayCompany').textContent = '';
  document.getElementById('overlayMessage').textContent = 'しばらくお待ちください';
  document.getElementById('overlayTime').textContent = '';
  document.getElementById('overlayButtons').style.display = 'none';
  document.getElementById('overlayNext').style.display = 'none';
}

function showOverlayPreview(v) {
  const ov = document.getElementById('overlay');
  ov.className = 'overlay preview show';
  document.getElementById('overlayIcon').textContent = '👤';
  document.getElementById('overlayName').textContent = v.name;
  document.getElementById('overlayCompany').textContent =
    v.company + (v.department ? '　' + v.department : '');
  document.getElementById('overlayMessage').textContent = 'この方を受付しますか？';
  document.getElementById('overlayTime').textContent = 'ID: ' + lastScannedId;
  document.getElementById('overlayButtons').style.display = 'flex';
  document.getElementById('overlayNext').style.display = 'none';
}

function showOverlayResult(result) {
  const ov = document.getElementById('overlay');
  document.getElementById('overlayButtons').style.display = 'none';
  document.getElementById('overlayNext').style.display = 'block';

  if (!result.success) {
    ov.className = 'overlay error show';
    document.getElementById('overlayIcon').textContent = '❌';
    document.getElementById('overlayName').textContent = '受付できませんでした';
    document.getElementById('overlayCompany').textContent = '';
    document.getElementById('overlayMessage').textContent = result.error || 'エラーが発生しました';
    document.getElementById('overlayTime').textContent = '';
    playSound(false);
    return;
  }

  const v = result.visitor;
  document.getElementById('overlayName').textContent = v.name;
  document.getElementById('overlayCompany').textContent =
    v.company + (v.department ? '　' + v.department : '');
  document.getElementById('overlayTime').textContent =
    '受付時刻：' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

  if (result.duplicate) {
    ov.className = 'overlay duplicate show';
    document.getElementById('overlayIcon').textContent = '⚠️';
    document.getElementById('overlayMessage').textContent = '本日すでに受付済みです';
    playSound('duplicate');
  } else {
    ov.className = 'overlay success show';
    document.getElementById('overlayIcon').textContent = '✅';
    document.getElementById('overlayMessage').textContent = 'ようこそ！受付完了しました';
    playSound(true);
  }
}

function showOverlayError(title, sub) {
  const ov = document.getElementById('overlay');
  ov.className = 'overlay error show';
  document.getElementById('overlayIcon').textContent = '❌';
  document.getElementById('overlayName').textContent = title;
  document.getElementById('overlayCompany').textContent = sub;
  document.getElementById('overlayMessage').textContent = '';
  document.getElementById('overlayTime').textContent = '';
  document.getElementById('overlayButtons').style.display = 'none';
  document.getElementById('overlayNext').style.display = 'block';
}

function hideOverlay() {
  document.getElementById('overlay').className = 'overlay';
  document.getElementById('overlayButtons').style.display = 'none';
  document.getElementById('overlayNext').style.display = 'none';
}

// ============================================================
// 受付確定・キャンセル・リセット
// ============================================================
function confirmCheckin() {
  if (!lastScannedId) return;
  document.getElementById('overlayButtons').style.display = 'none';
  showOverlayLoading();

  fetch(GAS_URL + '?action=checkin&visitorId=' + encodeURIComponent(lastScannedId))
    .then(r => r.json())
    .then(data => {
      showOverlayResult(data);
      loadCheckins();
    })
    .catch(() => {
      showOverlayResult({ success: false, error: '通信エラーが発生しました' });
    });
}

function cancelCheckin() {
  lastScannedId = null;
  resetScan();
}

function resetScan() {
  hideOverlay();
  lastScannedId = null;
  scanCooldown = false;
  scanPaused = false;

  if (html5QrCode && isScanning) {
    try { html5QrCode.resume(); } catch(e) {}
  }
  setStatus('scanning', 'スキャン待機中');
}

// ============================================================
// 手動入力
// ============================================================
function manualCheckin() {
  const id = document.getElementById('manualId').value.trim().toUpperCase();
  if (!id) { showToast('IDを入力してください'); return; }
  document.getElementById('manualId').value = '';

  lastScannedId = id;
  scanPaused = true;

  if (isScanning) {
    if (html5QrCode) { try { html5QrCode.pause(true); } catch(e) {} }
    setStatus('paused', '確認中...');
    showOverlayLoading();
    document.getElementById('cameraGuide').style.display = 'none';
  } else {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('cameraWrap').classList.add('active');
    showOverlayLoading();
  }

  fetch(GAS_URL + '?action=getVisitorInfo&visitorId=' + encodeURIComponent(id))
    .then(r => r.json())
    .then(data => {
      if (!data.success) { showOverlayError('来場者が見つかりません', 'ID: ' + id); return; }
      showOverlayPreview(data.visitor);
    })
    .catch(() => { showOverlayError('通信エラー', 'インターネット接続を確認してください'); });
}

// ============================================================
// OCR モーダル
// ============================================================
function openOcrModal() {
  document.getElementById('ocrModalOverlay').classList.add('show');
  resetOcrForm();
}

function closeOcrModal() {
  document.getElementById('ocrModalOverlay').classList.remove('show');
}

function triggerOcrCamera() {
  document.getElementById('ocrFileInput').click();
}

function onOcrImageSelected(event) {
  const file = event.target.files[0];
  if (!file) return;

  // プレビュー表示
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = document.getElementById('ocrPreviewImg');
    img.src = e.target.result;
    img.classList.add('show');
    document.getElementById('ocrShootLabel').textContent = '撮り直す';

    // base64データ（data:image/jpeg;base64,XXXX → XXXXの部分）
    const base64 = e.target.result.split(',')[1];
    const mimeType = file.type || 'image/jpeg';

    // GAS経由でGemini OCR呼び出し
    runOcr(base64, mimeType);
  };
  reader.readAsDataURL(file);

  // inputをリセット（同じファイルを再選択できるよう）
  event.target.value = '';
}

function runOcr(base64, mimeType) {
  // ステータスバー表示
  const statusBar = document.getElementById('ocrStatusBar');
  statusBar.classList.add('show');
  document.getElementById('ocrStatusText').textContent = 'Gemini AIが読み取り中です…少々お待ちください';

  // フォームを隠す
  document.getElementById('ocrForm').classList.remove('show');

  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      action: 'ocrCard',
      imageBase64: base64,
      mimeType: mimeType
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    statusBar.classList.remove('show');

    if (!data.success) {
      showToast('読み取りに失敗しました：' + (data.error || '不明なエラー'));
      return;
    }

    // フォームに結果を反映
    fillOcrForm(data.data);
  })
  .catch(function() {
    statusBar.classList.remove('show');
    showToast('通信エラーが発生しました');
  });
}

function fillOcrForm(d) {
  const fields = {
    'ocr_company':    d.company       || '',
    'ocr_department': d.department    || '',
    'ocr_furigana':   d.furigana      || '',
    'ocr_name':       d.name          || '',
    'ocr_email':      d.email         || '',
    'ocr_phone':      d.phone         || '',
    'ocr_zip':        d.zip_code      || '',
    'ocr_address':    d.store_address || '',
    'ocr_store_to':   d.store_to      || ''
  };

  Object.keys(fields).forEach(function(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.value = fields[id];
    // 読み取れた項目を緑色にしてわかりやすく
    if (fields[id]) {
      el.classList.add('ocr-filled');
    } else {
      el.classList.remove('ocr-filled');
    }
  });

  document.getElementById('ocrForm').classList.add('show');
}

function resetOcrForm() {
  // フォームをリセット
  const ids = ['ocr_company','ocr_department','ocr_furigana','ocr_name','ocr_email','ocr_phone','ocr_zip','ocr_address','ocr_store_to'];
  ids.forEach(function(id) {
    const el = document.getElementById(id);
    if (el) { el.value = ''; el.classList.remove('ocr-filled'); }
  });
  document.getElementById('ocrForm').classList.remove('show');
  document.getElementById('ocrStatusBar').classList.remove('show');

  const img = document.getElementById('ocrPreviewImg');
  img.src = '';
  img.classList.remove('show');
  document.getElementById('ocrShootLabel').textContent = 'カードを撮影する';
}

function submitOcrRegistration() {
  const company = document.getElementById('ocr_company').value.trim();
  const name    = document.getElementById('ocr_name').value.trim();

  if (!company) { showToast('会社名・店舗名を入力してください'); document.getElementById('ocr_company').focus(); return; }
  if (!name)    { showToast('氏名を入力してください'); document.getElementById('ocr_name').focus(); return; }

  const btn = document.querySelector('.ocr-form-actions .btn-success');
  btn.disabled = true;
  btn.textContent = '登録中…';

  const body = {
    action:        'addVisitor',
    secret:        'eiwa2026',
    company:       company,
    department:    document.getElementById('ocr_department').value.trim(),
    name:          name,
    email:         document.getElementById('ocr_email').value.trim(),
    phone:         document.getElementById('ocr_phone').value.trim(),
    zip_code:      document.getElementById('ocr_zip').value.trim(),
    store_address: document.getElementById('ocr_address').value.trim(),
    store_to:      document.getElementById('ocr_store_to').value.trim(),
    store_name:    company
  };

  fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (!data.success) {
      showToast('登録エラー：' + (data.error || '不明なエラー'));
      btn.disabled = false;
      btn.textContent = '✅ 登録して受付する';
      return;
    }

    // 登録成功 → そのままチェックイン
    const newId = data.id;
    closeOcrModal();
    showToast('登録完了！そのまま受付します…');

    // チェックイン処理
    fetch(GAS_URL + '?action=checkin&visitorId=' + encodeURIComponent(newId))
      .then(function(r) { return r.json(); })
      .then(function(checkinData) {
        // カメラが起動していない場合も受付完了を表示
        if (!isScanning) {
          document.getElementById('startBtn').style.display = 'none';
          document.getElementById('cameraWrap').classList.add('active');
        }
        lastScannedId = newId;
        showOverlayResult(checkinData.success ? checkinData : { success: true, duplicate: false, visitor: { name: name, company: company, department: '' } });
        loadCheckins();
      })
      .catch(function() {
        showToast('受付エラー。登録は完了しています（ID: ' + newId + '）');
      });
  })
  .catch(function() {
    showToast('通信エラーが発生しました');
    btn.disabled = false;
    btn.textContent = '✅ 登録して受付する';
  });
}

// ============================================================
// 受付ログ
// ============================================================
function loadCheckins() {
  fetch(GAS_URL + '?action=getCheckins')
    .then(r => r.json())
    .then(result => {
      const list = document.getElementById('logList');
      const data = (result.data || []).slice().reverse();
      document.getElementById('logCount').textContent = data.length + '名';
      document.getElementById('checkinCountBadge').textContent = '本日 ' + data.length + '名';
      if (data.length === 0) {
        list.innerHTML = '<div class="log-empty">まだ受付記録がありません</div>';
        return;
      }
      list.innerHTML = data.map(c => {
        const time = c.checked_in_at
          ? new Date(c.checked_in_at).toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'})
          : '--:--';
        return '<div class="log-item">'
          + '<div class="log-time">' + time + '</div>'
          + '<div class="log-info">'
          + '<div class="log-name">' + (c.visitor_name||'不明') + '</div>'
          + '<div class="log-company">' + (c.visitor_company||'') + '</div>'
          + '</div>'
          + '<div class="log-badge">受付済</div>'
          + '</div>';
      }).join('');
    }).catch(function(){});
}

// ============================================================
// 音声・トースト
// ============================================================
function playSound(type) {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.value = 0.3;
    if (type===true){osc.frequency.value=880;osc.start();osc.stop(ctx.currentTime+0.12);}
    else if(type==='duplicate'){osc.frequency.value=440;osc.start();osc.stop(ctx.currentTime+0.2);}
    else{osc.frequency.value=220;osc.start();osc.stop(ctx.currentTime+0.3);}
  } catch(e){}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// 初期化
// ============================================================
window.onload = function() {
  loadCheckins();
  setInterval(loadCheckins, 30000);
};
</script>
