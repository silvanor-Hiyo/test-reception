<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>受付 - 永和物産 食品展示会2026</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --navy: #0d1f5c;
  --navy-mid: #1a3a9e;
  --gold: #c8a84b;
  --gold-light: #e8cc80;
  --cream: #faf7f0;
  --white: #ffffff;
  --success: #1a6e35;
  --success-bg: #e8f7ed;
  --warning: #92400e;
  --warning-bg: #fef3c7;
  --danger: #991b1b;
  --danger-bg: #fef2f2;
  --text: #1a1a2e;
  --text-light: #6b6b8a;
  --border: #ddd5be;
}

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--navy);
  color: var(--white);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ヘッダー */
.header {
  background: var(--navy);
  padding: 16px 20px 12px;
  text-align: center;
  border-bottom: 2px solid var(--gold);
  flex-shrink: 0;
}
.header-event {
  font-size: 10px;
  letter-spacing: 3px;
  color: rgba(200,168,75,0.8);
  font-weight: 600;
  margin-bottom: 4px;
}
.header h1 {
  font-family: 'Noto Serif JP', serif;
  font-size: 18px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 1px;
}
.header-sub {
  font-size: 12px;
  color: var(--gold-light);
  margin-top: 2px;
}

/* メインエリア */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  gap: 16px;
  overflow-y: auto;
}

/* スキャナーカード */
.scanner-card {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(200,168,75,0.3);
  border-radius: 16px;
  padding: 16px;
}

.scanner-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--gold-light);
  margin-bottom: 12px;
  text-align: center;
  letter-spacing: 1px;
}

#qr-reader {
  width: 100%;
  border-radius: 10px;
  overflow: hidden;
  background: #000;
}

#qr-reader video {
  border-radius: 10px;
  width: 100% !important;
}

/* ボタン */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 20px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
}
.btn-gold {
  background: linear-gradient(135deg, var(--gold), #a07828);
  color: var(--navy);
}
.btn-gold:active { transform: scale(0.97); }
.btn-outline {
  background: transparent;
  border: 1.5px solid rgba(200,168,75,0.5);
  color: var(--gold-light);
  font-size: 14px;
  padding: 11px 20px;
}
.btn-danger-outline {
  background: transparent;
  border: 1.5px solid rgba(239,68,68,0.5);
  color: #fca5a5;
  font-size: 13px;
  padding: 10px 20px;
}

/* 結果表示 */
.result {
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  display: none;
  animation: slideUp 0.3s ease;
}
.result.show { display: block; }
.result.success { background: var(--success-bg); border: 1px solid #a8ddb8; }
.result.warning { background: var(--warning-bg); border: 1px solid #fde68a; }
.result.error   { background: var(--danger-bg);  border: 1px solid #fecaca; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.result-icon { font-size: 48px; margin-bottom: 8px; }
.result-name { font-size: 24px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
.result-company { font-size: 14px; color: #555; margin-bottom: 4px; }
.result-dept { font-size: 13px; color: #777; }
.result-message { font-size: 14px; font-weight: 600; margin-top: 10px; }
.result.success .result-message { color: var(--success); }
.result.warning .result-message { color: var(--warning); }
.result.error   .result-message { color: var(--danger); }

/* 手動入力 */
.manual-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 16px;
}
.manual-title {
  font-size: 12px;
  color: var(--text-light);
  margin-bottom: 10px;
  text-align: center;
}
.manual-row {
  display: flex;
  gap: 8px;
}
.manual-input {
  flex: 1;
  padding: 12px 14px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px;
  background: rgba(255,255,255,0.08);
  color: var(--white);
  font-size: 15px;
  font-family: inherit;
  outline: none;
}
.manual-input::placeholder { color: rgba(255,255,255,0.3); }
.manual-input:focus { border-color: var(--gold); }
.manual-btn {
  padding: 12px 16px;
  background: var(--gold);
  color: var(--navy);
  border: none;
  border-radius: 8px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  font-size: 14px;
  white-space: nowrap;
}

/* 受付数カウンター */
.counter {
  text-align: center;
  padding: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  border: 1px solid rgba(200,168,75,0.2);
}
.counter-num {
  font-size: 32px;
  font-weight: 700;
  color: var(--gold-light);
}
.counter-label {
  font-size: 12px;
  color: rgba(255,255,255,0.5);
  margin-top: 2px;
}

/* GAS URL設定画面 */
.setup {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  flex: 1;
  padding: 24px;
  gap: 16px;
}
.setup-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 20px;
  color: var(--gold-light);
  text-align: center;
}
.setup-desc {
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  text-align: center;
  line-height: 1.7;
}
.setup-input {
  width: 100%;
  padding: 14px;
  border: 1.5px solid rgba(200,168,75,0.4);
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  color: var(--white);
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.setup-input:focus { border-color: var(--gold); }
.setup-alert {
  width: 100%;
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 13px;
  display: none;
}
.setup-alert.show { display: block; }
.setup-alert.success { background: var(--success-bg); color: var(--success); }
.setup-alert.error   { background: var(--danger-bg);  color: var(--danger); }
</style>
</head>
<body>

<div class="header">
  <div class="header-event">EIWA BUSSAN FOOD EXHIBITION 2026</div>
  <h1>受付システム</h1>
  <div class="header-sub">QRコードをスキャンしてください</div>
</div>

<!-- GAS URL設定画面 -->
<div class="setup" id="setupArea">
  <div class="setup-title">初期設定</div>
  <p class="setup-desc">GAS WebアプリのURLを入力してください。<br>一度設定すれば次回から不要です。</p>
  <input type="url" class="setup-input" id="gasUrlInput" placeholder="https://script.google.com/macros/s/xxx/exec">
  <button class="btn btn-gold" onclick="saveGasUrl()">接続して受付を開始</button>
  <div class="setup-alert" id="setupAlert"></div>
</div>

<!-- メイン受付画面 -->
<div class="main" id="mainArea" style="display:none;">

  <!-- カウンター -->
  <div class="counter">
    <div class="counter-num" id="checkinCount">0</div>
    <div class="counter-label">本日の受付数</div>
  </div>

  <!-- 結果表示 -->
  <div class="result" id="result">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-name" id="resultName"></div>
    <div class="result-company" id="resultCompany"></div>
    <div class="result-dept" id="resultDept"></div>
    <div class="result-message" id="resultMessage"></div>
  </div>

  <!-- スキャナー -->
  <div class="scanner-card">
    <div class="scanner-title">📷 QRコードスキャン</div>
    <div id="qr-reader"></div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button class="btn btn-gold" id="startBtn" onclick="startScanner()">カメラを起動</button>
      <button class="btn btn-danger-outline" id="stopBtn" onclick="stopScanner()" style="display:none;">停止</button>
    </div>
  </div>

  <!-- 手動入力 -->
  <div class="manual-card">
    <div class="manual-title">手動入力（QRコードを忘れた場合）</div>
    <div class="manual-row">
      <input type="text" class="manual-input" id="manualId" placeholder="来場者ID（例: V-ABC123）">
      <button class="manual-btn" onclick="manualCheckin()">受付</button>
    </div>
  </div>

  <!-- 設定リセット -->
  <button class="btn btn-outline" onclick="resetSetup()" style="margin-bottom:8px;">⚙️ GAS URL設定を変更</button>

</div>

<script>
let GAS_URL = localStorage.getItem('reception_gas_url') || '';
let scanner = null;
let checkinCount = 0;
let isScanning = false;

// 初期化
function init() {
  if (GAS_URL) {
    document.getElementById('setupArea').style.display = 'none';
    document.getElementById('mainArea').style.display = 'flex';
    document.getElementById('gasUrlInput').value = GAS_URL;
    loadCheckinCount();
  } else {
    document.getElementById('setupArea').style.display = 'flex';
    document.getElementById('mainArea').style.display = 'none';
  }
}

// GAS URL保存
async function saveGasUrl() {
  const url = document.getElementById('gasUrlInput').value.trim();
  const alertEl = document.getElementById('setupAlert');

  if (!url) {
    alertEl.className = 'setup-alert error show';
    alertEl.textContent = 'URLを入力してください';
    return;
  }

  alertEl.className = 'setup-alert show';
  alertEl.style.background = '#eef2ff';
  alertEl.style.color = '#1a3a9e';
  alertEl.textContent = '接続テスト中...';

  try {
    const res = await fetch(url + '?action=ping');
    const data = await res.json();
    if (!data.success) throw new Error('接続失敗');

    GAS_URL = url;
    localStorage.setItem('reception_gas_url', url);
    alertEl.className = 'setup-alert success show';
    alertEl.textContent = '接続成功！';

    setTimeout(() => {
      document.getElementById('setupArea').style.display = 'none';
      document.getElementById('mainArea').style.display = 'flex';
      loadCheckinCount();
    }, 800);

  } catch(e) {
    alertEl.className = 'setup-alert error show';
    alertEl.textContent = '接続できませんでした。URLを確認してください。';
  }
}

// 設定リセット
function resetSetup() {
  stopScanner();
  localStorage.removeItem('reception_gas_url');
  GAS_URL = '';
  document.getElementById('setupArea').style.display = 'flex';
  document.getElementById('mainArea').style.display = 'none';
}

// 受付数を取得
async function loadCheckinCount() {
  try {
    const res = await fetch(GAS_URL + '?action=getCheckins');
    const data = await res.json();
    if (data.success) {
      checkinCount = (data.data || []).length;
      document.getElementById('checkinCount').textContent = checkinCount;
    }
  } catch(e) {}
}

// スキャナー起動
function startScanner() {
  if (isScanning) return;
  isScanning = true;
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'flex';

  scanner = new Html5Qrcode('qr-reader');
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    async (decodedText) => {
      if (!isScanning) return;
      await processCheckin(decodedText.trim());
      scanner.pause(true);
      setTimeout(() => {
        try { if (isScanning) scanner.resume(); } catch(e) {}
      }, 7000);
    },
    () => {}
  ).catch(err => {
    isScanning = false;
    document.getElementById('startBtn').style.display = 'flex';
    document.getElementById('stopBtn').style.display = 'none';
    showResult('error', '❌', 'カメラエラー', 'カメラを起動できませんでした', '', '');
  });
}

// スキャナー停止
function stopScanner() {
  isScanning = false;
  if (scanner) {
    try { scanner.stop(); } catch(e) {}
    scanner = null;
  }
  document.getElementById('startBtn').style.display = 'flex';
  document.getElementById('stopBtn').style.display = 'none';
}

// 手動受付
async function manualCheckin() {
  const id = document.getElementById('manualId').value.trim();
  if (!id) return;
  await processCheckin(id);
  document.getElementById('manualId').value = '';
}

// 受付処理
async function processCheckin(visitorId) {
  try {
    const res = await fetch(GAS_URL + '?action=checkin&visitorId=' + encodeURIComponent(visitorId));
    const data = await res.json();

    if (!data.success) {
      showResult('error', '❌', 'エラー', data.error || '来場者が見つかりません', '', '');
      playBeep(300);
      return;
    }

    const v = data.visitor;
    if (data.duplicate) {
      showResult('warning', '⚠️', v.name, v.company, v.department || '', 'すでに本日受付済みです');
      playBeep(400);
    } else {
      checkinCount++;
      document.getElementById('checkinCount').textContent = checkinCount;
      showResult('success', '✅', v.name, v.company, v.department || '', '受付完了！ようこそ！');
      playBeep(800);
    }
  } catch(e) {
    showResult('error', '❌', '通信エラー', '再度お試しください', '', '');
  }
}

// 結果表示
function showResult(type, icon, name, company, dept, message) {
  const el = document.getElementById('result');
  el.className = 'result ' + type + ' show';
  document.getElementById('resultIcon').textContent = icon;
  document.getElementById('resultName').textContent = name;
  document.getElementById('resultCompany').textContent = company;
  document.getElementById('resultDept').textContent = dept;
  document.getElementById('resultMessage').textContent = message;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ビープ音
function playBeep(freq) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.frequency.value = freq;
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch(e) {}
}

init();
</script>
</body>
</html>
