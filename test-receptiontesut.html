<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>受付 - 永和物産 食品展示会2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root {
  --navy: #0d1f5c;
  --navy-mid: #1a3a9e;
  --gold: #c8a84b;
  --gold-light: #e8cc80;
  --gold-pale: #f7f0dc;
  --cream: #faf7f0;
  --white: #ffffff;
  --text: #1a1a2e;
  --text-light: #6b6b8a;
  --border: #ddd5be;
  --success: #1a6e35;
  --success-bg: #e8f7ed;
  --warning-bg: #fff8e1;
  --warning: #92400e;
  --error: #8b1a1a;
  --error-bg: #fdf0f0;
  --radius: 14px;
  --shadow: 0 4px 20px rgba(13,31,92,0.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
  background: var(--cream);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 40px;
}

/* ===== ヘッダー ===== */
.header {
  background: linear-gradient(160deg, #1a3a9e 0%, #0d1f5c 100%);
  border-bottom: 3px solid var(--gold);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(13,31,92,0.4);
}
.header-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.header-label { font-size: 10px; letter-spacing: 3px; color: var(--gold-light); font-weight: 600; }
.header-title { font-size: 18px; font-weight: 700; color: white; }
.header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.header-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.08);
  padding: 6px 12px; border-radius: 20px;
  border: 1px solid rgba(200,168,75,0.3);
}
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #4caf50; box-shadow: 0 0 6px #4caf50;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.btn-logout {
  background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85);
  border: 1px solid rgba(255,255,255,0.3); border-radius: 20px;
  padding: 6px 12px; font-size: 12px; font-weight: 600;
  font-family: inherit; cursor: pointer; white-space: nowrap;
}
.operator-bar {
  background: var(--gold-pale); border-bottom: 1px solid var(--border);
  padding: 8px 16px; font-size: 13px; color: var(--navy);
  display: flex; justify-content: center; align-items: center; gap: 6px;
}
.operator-bar strong { font-weight: 700; }

main { max-width: 560px; margin: 0 auto; padding: 20px 16px; }

/* ===== カード ===== */
.card {
  background: var(--white); border-radius: var(--radius);
  padding: 24px 20px; margin-bottom: 16px;
  box-shadow: var(--shadow); border: 1px solid var(--border);
  position: relative; overflow: hidden;
}
.card::before {
  content: ''; position: absolute;
  top: 0; left: 20px; right: 20px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0.5;
}
.card-title {
  font-size: 15px; font-weight: 700; color: var(--navy);
  margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
}

/* ===== カメラエリア（オーバーレイ方式） ===== */
.camera-wrap {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 16px;
  border: 2px solid var(--gold);
  box-shadow: var(--shadow);
  background: #000;
  display: none;
}
.camera-wrap.active { display: block; min-height: 400px; }

.camera-header {
  background: var(--navy);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.camera-title {
  font-size: 14px; font-weight: 700; color: var(--gold-light);
  display: flex; align-items: center; gap: 8px;
}
.camera-status {
  font-size: 11px; color: rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.08);
  padding: 4px 10px; border-radius: 12px;
}
.camera-status.scanning { color: #4caf50; background: rgba(76,175,80,0.15); }
.camera-status.paused { color: var(--gold-light); background: rgba(200,168,75,0.15); }
.camera-status.assign { color: #ffcf80; background: rgba(180,83,9,0.3); }

#qr-reader { width: 100%; background: #000; }
#qr-reader video { width: 100% !important; max-height: 300px; object-fit: cover; }
#qr-reader__scan_region { background: transparent !important; }
#qr-reader__scan_region img { display: none !important; }
#qr-reader__dashboard { display: none !important; }

.camera-guide {
  background: rgba(0,0,0,0.6);
  padding: 10px 16px; text-align: center;
  font-size: 13px; color: rgba(255,255,255,0.8);
}

/* ===== オーバーレイ（カメラの上に重ねる結果画面） ===== */
.overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
  animation: fadeIn 0.3s ease;
  overflow-y: auto;
}
.overlay.show { display: flex; }
.overlay.preview { background: rgba(13,31,92,0.92); }
.overlay.success { background: rgba(26,110,53,0.93); }
.overlay.duplicate { background: rgba(146,64,14,0.93); }
.overlay.error { background: rgba(139,26,26,0.93); }
.overlay.loading { background: rgba(13,31,92,0.85); }
.overlay.assign { background: rgba(146,64,14,0.94); }

@keyframes fadeIn { from{opacity:0;transform:scale(0.95)} to{opacity:1;transform:scale(1)} }

.overlay-icon { font-size: 52px; margin-bottom: 10px; }
.overlay-name { font-size: 24px; font-weight: 700; color: white; margin-bottom: 6px; text-align: center; }
.overlay-company { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 8px; text-align: center; line-height: 1.5; }
.overlay-message { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.9); text-align: center; }
.overlay-time { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 6px; text-align: center; }

.overlay-buttons {
  display: flex; gap: 10px; width: 100%;
}
.overlay-buttons .btn { flex: 1; }

/* ===== カード番号バッジ ===== */
.card-no-badge {
  display: inline-block; margin-top: 10px;
  background: rgba(255,255,255,0.18);
  border: 1.5px solid rgba(255,255,255,0.5);
  color: white; font-size: 15px; font-weight: 700;
  padding: 5px 16px; border-radius: 20px; letter-spacing: 1px;
}

/* ===== カメラ起動ボタン ===== */
.btn-camera-start {
  width: 100%; padding: 20px;
  background: linear-gradient(135deg, var(--navy), var(--navy-mid));
  color: var(--gold-light); border: 2px solid var(--gold);
  border-radius: var(--radius);
  font-size: 17px; font-weight: 700; font-family: inherit;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin-bottom: 16px; box-shadow: var(--shadow); transition: all 0.2s;
}
.btn-camera-start .icon { font-size: 32px; }
.camera-stop-btn {
  background: var(--navy); padding: 10px 16px;
  text-align: center;
}

/* ===== ボタン ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; padding: 13px 20px; border: none; border-radius: 10px;
  font-size: 15px; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gold) 0%, #b8922e 100%);
  color: var(--navy); box-shadow: 0 2px 8px rgba(200,168,75,0.3);
}
.btn-danger { background: linear-gradient(135deg, #e53935, #c62828); color: white; }
.btn-outline { background: rgba(255,255,255,0.15); color: white; border: 1.5px solid rgba(255,255,255,0.4); }
.btn-outline-dark { background: transparent; color: var(--navy-mid); border: 1.5px solid var(--border); }
.btn-success { background: linear-gradient(135deg, #2e7d32, #1a6e35); color: white; }
.btn-block { width: 100%; }

/* ===== 手動入力 ===== */
.manual-row { display: flex; gap: 8px; }
.input-field {
  flex: 1; padding: 12px 14px; border: 1.5px solid var(--border);
  border-radius: 10px; font-size: 15px; font-family: inherit;
  color: var(--text); outline: none; transition: border-color 0.2s;
  -webkit-appearance: none; background: white;
}
.input-field:focus { border-color: var(--navy-mid); }
.input-field::placeholder { color: #bbb8d0; font-size: 13px; }

/* ===== 受付ログ ===== */
.log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.log-count {
  background: var(--gold-pale); color: var(--navy);
  font-size: 12px; font-weight: 700; padding: 4px 10px;
  border-radius: 20px; border: 1px solid rgba(200,168,75,0.3);
}
.log-list { display: flex; flex-direction: column; gap: 8px; }
.log-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; background: var(--cream);
  border-radius: 10px; border: 1px solid var(--border);
}
.log-time { font-size: 12px; color: var(--text-light); white-space: nowrap; min-width: 42px; }
.log-info { flex: 1; min-width: 0; }
.log-name { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-company { font-size: 12px; color: var(--text-light); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-badge { font-size: 10px; padding: 3px 8px; border-radius: 6px; background: var(--success-bg); color: var(--success); font-weight: 700; white-space: nowrap; }
.log-empty { text-align: center; padding: 24px; color: var(--text-light); font-size: 14px; }

/* ===== スピナー ===== */
.spinner {
  display: inline-block; width: 40px; height: 40px;
  border: 4px solid rgba(255,255,255,0.2);
  border-top-color: white; border-radius: 50%;
  animation: spin 0.8s linear infinite; margin-bottom: 12px;
}
@keyframes spin { to{transform:rotate(360deg)} }

/* ===== トースト ===== */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--navy); color: white;
  padding: 12px 24px; border-radius: 30px;
  font-size: 14px; font-weight: 600;
  border: 1px solid var(--gold);
  box-shadow: 0 4px 20px rgba(13,31,92,0.3);
  z-index: 999; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
/* ===== 名前検索の結果 ===== */
.search-results { margin-top: 10px; }
.search-result {
  display: block; width: 100%; text-align: left;
  background: #faf9ff; border: 1px solid #ddd8f0;
  border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
}
.search-result:active { background: #ece8ff; }
.sr-name { display: block; font-size: 15px; font-weight: 700; color: var(--navy); }
.sr-company { display: block; font-size: 12px; color: var(--text-light); margin-top: 2px; }
.sr-id { display: block; font-size: 11px; color: #9a96b8; font-family: monospace; margin-top: 2px; }
.search-hint { font-size: 12px; color: var(--text-light); padding: 8px 2px; }

/* ===== スタッフ認証画面 ===== */
.lock-screen {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(160deg, #1a3a9e 0%, #0d1f5c 100%);
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.lock-card {
  background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 28px 24px; width: 100%; max-width: 360px; text-align: center;
}
.lock-title { font-size: 18px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.lock-desc { font-size: 13px; color: var(--text-light); margin-bottom: 16px; line-height: 1.7; }
.lock-error { font-size: 13px; color: var(--error); margin-top: 10px; min-height: 18px; font-weight: 600; }
.lock-label { display: block; text-align: left; font-size: 12px; font-weight: 600; color: var(--text-light); margin: 12px 0 4px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-label">EIWA BUSSAN 2026</div>
    <div class="header-title">来場者受付</div>
  </div>
  <div class="header-right">
    <div class="header-status">
      <div class="status-dot"></div>
      <span id="checkinCountBadge">本日 0名</span>
    </div>
    <button class="btn-logout" onclick="logout()">ログアウト</button>
  </div>
</div>

<div class="operator-bar" id="operatorBar" style="display:none;">
  担当：<strong id="operatorNameLabel"></strong>
</div>

<main>

  <!-- ===== カメラ起動ボタン ===== -->
  <button class="btn-camera-start" id="startBtn" onclick="startCamera()">
    <span class="icon">📷</span>
    <span>カメラを起動してQRをスキャン</span>
  </button>

  <!-- ===== カメラ＋オーバーレイ ===== -->
  <div class="camera-wrap" id="cameraWrap">

    <div class="camera-header">
      <div class="camera-title"><span>📷</span> QRコードをスキャン中</div>
      <div class="camera-status scanning" id="cameraStatus">スキャン待機中</div>
    </div>

    <div id="qr-reader"></div>

    <div class="camera-guide" id="cameraGuide">
      お客様の入場証QRコードをカメラに向けてください
    </div>

    <!-- ===== 仮カードのスキャン待ち（カメラ映像は隠しません） ===== -->
    <div id="assignBar" style="display:none; background:#92400e; padding:12px 14px;">
      <div style="color:#ffcf80; font-size:11px; font-weight:700; letter-spacing:2px;">仮カードを渡す</div>
      <div id="assignBarName" style="color:#fff; font-size:17px; font-weight:700; margin-top:2px;"></div>
      <div id="assignBarCompany" style="color:rgba(255,255,255,0.75); font-size:12px;"></div>
      <div style="color:#fff; font-size:13px; font-weight:700; margin:10px 0 8px; text-align:center;">
        ↑ カードのQRコードをカメラに向けてください
      </div>
      <div class="manual-row">
        <input type="text" class="input-field" id="assignCardInput"
          placeholder="読めないときはIDを入力（例：V-K7M2PQ）"
          autocapitalize="characters" autocomplete="off"
          onkeydown="if(event.key==='Enter') submitAssignCard()">
        <button class="btn btn-primary" onclick="submitAssignCard()">確定</button>
      </div>
      <div id="assignBarError" style="color:#ffd7d7; font-size:12px; font-weight:700; margin-top:8px; display:none;"></div>
      <button class="btn btn-outline btn-block" style="margin-top:10px;" onclick="cancelAssign()">やめる</button>
    </div>

    <div class="overlay" id="overlay">
      <div class="overlay-icon" id="overlayIcon"></div>
      <div class="overlay-name" id="overlayName"></div>
      <div class="overlay-company" id="overlayCompany"></div>
      <div class="overlay-message" id="overlayMessage"></div>
      <div class="overlay-time" id="overlayTime"></div>
      <div id="overlayCardNo" style="display:none;"></div>

      <!-- 受付するかどうかのボタン -->
      <div id="overlayActions" style="display:none; width:100%; margin-top:18px;">
        <button class="btn btn-success btn-block" id="btnAssign"
          style="display:none; margin-bottom:10px;" onclick="beginAssign()">
          🎫 仮カードを渡して受付
        </button>
        <div class="overlay-buttons">
          <button class="btn btn-danger" onclick="cancelCheckin()">❌ キャンセル</button>
          <button class="btn btn-primary" id="btnCheckin" onclick="confirmCheckin()">✅ 受付する</button>
        </div>
        <div id="noCardLink" style="display:none;text-align:center;margin-top:22px;">
          <span onclick="checkinWithoutCard()"
            style="font-size:11px;color:rgba(255,255,255,0.45);text-decoration:underline;cursor:pointer;padding:6px 10px;">
            カードを渡さずに受付する
          </span>
        </div>
      </div>

      <div id="overlayNext" style="display:none; margin-top:16px; width:100%;">
        <button class="btn btn-outline btn-block" onclick="resetScan()">次の受付へ →</button>
      </div>
    </div>

    <div class="camera-stop-btn">
      <button class="btn btn-outline-dark btn-block" onclick="stopCamera()" style="font-size:13px;padding:10px;">
        カメラを停止する
      </button>
    </div>
  </div>

  <!-- ===== 名前検索・手動入力 ===== -->
  <div class="card">
    <div class="card-title"><span>🔍</span>名前検索（QRを忘れた場合）</div>
    <p style="font-size:13px;color:var(--text-light);margin-bottom:12px;">
      お名前・会社名・来場者ID のどれでも検索できます<br>
      （IDは「V-」やハイフンを省略してもOK。例：ABC123）<br>
      見つかったら、そのまま<strong>仮カードを渡して受付</strong>できます
    </p>
    <div class="manual-row">
      <input type="text" class="input-field" id="manualId"
        placeholder="例：山田 ／ 永和物産 ／ ABC123"
        onkeydown="if(event.key==='Enter') manualCheckin()">
      <button class="btn btn-primary" onclick="manualCheckin()">検索</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <!-- ===== 受付ログ ===== -->
  <div class="card">
    <div class="log-header">
      <div class="card-title" style="margin:0"><span>📋</span>本日の受付記録</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="log-count" id="logCount">0名</span>
        <button class="btn btn-outline-dark" onclick="loadCheckins()" style="padding:6px 12px;font-size:12px;">更新</button>
      </div>
    </div>
    <div class="log-list" id="logList">
      <div class="log-empty">まだ受付記録がありません</div>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<!-- ===== スタッフ認証画面 ===== -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <div class="lock-title">🔒 スタッフ認証</div>
    <p class="lock-desc">受付を開始するには、<br>スタッフ用の合言葉を入力してください。</p>
    <label class="lock-label">合言葉</label>
    <input type="password" class="input-field" id="staffKeyInput" placeholder="合言葉"
      style="width:100%;" onkeydown="if(event.key==='Enter') submitStaffKey()">
    <label class="lock-label">担当者名（お名前 または 端末名）</label>
    <input type="text" class="input-field" id="operatorInput" placeholder="例：山田 ／ 受付1番端末"
      style="width:100%;" onkeydown="if(event.key==='Enter') submitStaffKey()">
    <button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="submitStaffKey()">認証して開始</button>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzu01ilMhbcurDDW8Y7ZdW8IQaf54k3qVoCGfGcueOZWcMUKiFSWQH1bj3Ic-CB4ZLdIg/exec';

// ============================================================
// ★ スタッフ認証の管理
//  - 合言葉＋担当者名を localStorage に記憶
//  - 60分間操作がなければ自動ログアウト
//  - 日付が変わったら再認証（前日の認証は無効）
//  - ヘッダーの「ログアウト」ボタンで手動ログアウト
// ============================================================
const IDLE_LIMIT_MS = 60 * 60 * 1000; // 無操作60分で自動ログアウト

let STAFF_KEY = localStorage.getItem('staffKey') || '';
let OPERATOR  = localStorage.getItem('staffOperator') || '';

function withKey(url) { return url + '&secret=' + encodeURIComponent(STAFF_KEY); }

function todayString() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function touchActivity() {
  if (STAFF_KEY) localStorage.setItem('staffLastActive', String(Date.now()));
}

function isAuthExpired() {
  const authDay = localStorage.getItem('staffAuthDay') || '';
  if (authDay !== todayString()) return true; // 日付が変わったら失効
  const last = parseInt(localStorage.getItem('staffLastActive') || '0', 10);
  if (!last) return true;
  return (Date.now() - last) > IDLE_LIMIT_MS;
}

function logout(message) {
  STAFF_KEY = '';
  OPERATOR = '';
  localStorage.removeItem('staffKey');
  localStorage.removeItem('staffOperator');
  localStorage.removeItem('staffAuthDay');
  localStorage.removeItem('staffLastActive');
  document.getElementById('operatorBar').style.display = 'none';
  try { stopCamera(); } catch(e) {}
  showLock(message || 'ログアウトしました');
}

// 画面操作があるたびに「最終操作時刻」を更新
document.addEventListener('click', touchActivity);
document.addEventListener('touchstart', touchActivity);
document.addEventListener('keydown', touchActivity);

// 1分ごとに期限チェック
setInterval(function() {
  if (STAFF_KEY && isAuthExpired()) {
    logout('一定時間操作がなかったため、再認証してください');
  }
}, 60 * 1000);

// ============================================================
// ★ 自動リトライ付き通信
// 回線混雑やGASの同時実行上限で失敗したとき、
// 少し待って自動でやり直す（最大4回。待ち時間は倍々＋ランダム）
// ============================================================
async function fetchJsonWithRetry(url, options) {
  let lastError;
  for (let attempt = 0; attempt <= 4; attempt++) {
    if (attempt > 0) {
      const wait = Math.min(500 * Math.pow(2, attempt - 1), 4000) + Math.random() * 400;
      await new Promise(res => setTimeout(res, wait));
    }
    try {
      const resp = await fetch(url, options);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return await resp.json();
    } catch (err) {
      lastError = err;
    }
  }
  throw lastError;
}


let html5QrCode = null;
let isScanning = false;
let scanPaused = false;
let lastScannedId = null;
let scanCooldown = false;
let lastScanMethod = 'QR'; // 'QR' または '検索'

// ★ 仮カード割り当て用
let currentVisitor = null;   // いま画面に出ている来場者
let assignMode     = false;  // true のあいだは「次に読むQR＝仮カード」
let assignTarget   = null;   // 仮カードを渡す相手
let assignedCardNo = null;   // 割り当てたカード番号（表示用）

// ============================================================
// カメラ起動・停止
// ============================================================
function startCamera() {
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('cameraWrap').classList.add('active');

  html5QrCode = new Html5Qrcode('qr-reader');

  const config = {
    fps: 20,
    qrbox: { width: 280, height: 280 },
    aspectRatio: 1.0,
    disableFlip: false,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  };

  html5QrCode.start(
    { facingMode: 'environment' },
    config,
    onQrSuccess,
    () => {}
  ).then(() => {
    isScanning = true;
    scanPaused = false;
    if (assignMode) setStatus('assign', '仮カードをスキャン');
    else            setStatus('scanning', 'スキャン待機中');
  }).catch(err => {
    showToast('カメラの起動に失敗しました');
    document.getElementById('startBtn').style.display = 'flex';
    document.getElementById('cameraWrap').classList.remove('active');
  });
}

function stopCamera() {
  hideOverlay();
  hideAssignBar();
  assignMode = false;
  assignTarget = null;
  if (html5QrCode && isScanning) {
    html5QrCode.stop().then(() => {
      isScanning = false;
      html5QrCode = null;
    });
  }
  document.getElementById('cameraWrap').classList.remove('active');
  document.getElementById('startBtn').style.display = 'flex';
}

function setStatus(type, text) {
  const el = document.getElementById('cameraStatus');
  el.textContent = text;
  el.className = 'camera-status ' + type;
}

// ============================================================
// QRスキャン成功
// ============================================================
function onQrSuccess(decodedText) {
  if (scanCooldown) return;
  scanCooldown = true;
  setTimeout(() => { scanCooldown = false; }, 3000);

  let visitorId = '';
  try {
    const url = new URL(decodedText);
    visitorId = url.searchParams.get('id') || '';
  } catch(e) {
    visitorId = decodedText.trim().toUpperCase();
  }

  if (!visitorId) { showToast('QRコードを認識できませんでした'); return; }

  touchActivity();

  // ★ 仮カードのスキャン待ちなら、そちらの処理へ
  if (assignMode) { handleCardScan(visitorId); return; }

  if (scanPaused) return;

  lastScanMethod = 'QR';
  scanPaused = true;
  if (html5QrCode) { try { html5QrCode.pause(true); } catch(e) {} }
  setStatus('paused', '確認中...');

  showOverlayLoading();
  lastScannedId = visitorId;

  fetchJsonWithRetry(withKey(GAS_URL + '?action=getVisitorInfo&visitorId=' + encodeURIComponent(visitorId)))
    .then(data => {
      if (!data.success) {
        showOverlayError('来場者が見つかりません', 'ID: ' + visitorId);
        return;
      }
      showOverlayPreview(data.visitor);
    })
    .catch(() => {
      showOverlayError('通信エラー', 'インターネット接続を確認してください');
    });
}

// ============================================================
// オーバーレイ表示
// ============================================================
function hideAllOverlayBlocks() {
  document.getElementById('overlayActions').style.display = 'none';
  document.getElementById('overlayNext').style.display = 'none';
  document.getElementById('overlayCardNo').style.display = 'none';
}

function showOverlayLoading() {
  const ov = document.getElementById('overlay');
  ov.className = 'overlay loading show';
  document.getElementById('overlayIcon').innerHTML = '<div class="spinner"></div>';
  document.getElementById('overlayName').textContent = '確認中...';
  document.getElementById('overlayCompany').textContent = '';
  document.getElementById('overlayMessage').textContent = 'しばらくお待ちください';
  document.getElementById('overlayTime').textContent = '';
  hideAllOverlayBlocks();
}

function showOverlayPreview(v) {
  currentVisitor = v;

  // ★ 渡し済みの仮カードを読んだときは、受付せずに警告を出す
  //   （部署名に【カードNo.○○○】が入っていたら、渡し済みのカード）
  const cardMark = String(v.department || '').match(/【カードNo\.([^】]+)】/);
  if (cardMark && lastScanMethod === 'QR') {
    showOverlayCardUsed(v, cardMark[1]);
    return;
  }

  const ov = document.getElementById('overlay');
  ov.className = 'overlay preview show';
  document.getElementById('overlayIcon').textContent = '👤';
  document.getElementById('overlayName').textContent = v.name;
  document.getElementById('overlayCompany').textContent =
    v.company + (v.department ? '　' + v.department : '');
  document.getElementById('overlayMessage').textContent = 'この方を受付しますか？';
  document.getElementById('overlayTime').textContent = 'ID: ' + lastScannedId;
  hideAllOverlayBlocks();
  document.getElementById('overlayActions').style.display = 'block';

  // ★ 名前検索で見つけた方（＝QRを忘れた方）だけ、仮カードを渡すボタンを出す
  //   すでに仮カードそのものをスキャンした場合は出さない
  const isTempCard = String(v.company || '').indexOf('当日受付') >= 0;
  const canAssign  = (lastScanMethod === '検索') && !isTempCard;

  // 仮カードを渡す場合は、緑の大きいボタンだけを目立たせる。
  // 「カードを渡さずに受付」は下の小さな文字リンクにして、押し間違いを防ぐ。
  document.getElementById('btnAssign').style.display   = canAssign ? 'flex' : 'none';
  document.getElementById('noCardLink').style.display  = canAssign ? 'block' : 'none';
  document.getElementById('btnCheckin').style.display  = canAssign ? 'none' : 'inline-flex';
  document.getElementById('btnCheckin').textContent    = '✅ 受付する';
}

// 「カードを渡さずに受付」…押し間違い防止のため、確認をはさむ
function checkinWithoutCard() {
  const name = (currentVisitor && currentVisitor.name) ? currentVisitor.name + ' 様' : 'この方';
  const ok = window.confirm(
    name + 'を、仮カードを渡さずに受付します。\n\n' +
    '※ カードがないと、ブースでサンプル依頼ができません。\n\n' +
    'よろしいですか？');
  if (!ok) return;
  confirmCheckin();
}

// ★ すでにお客様にお渡し済みのカードを読んだとき
function showOverlayCardUsed(v, cardNo) {
  const ov = document.getElementById('overlay');
  ov.className = 'overlay duplicate show';
  document.getElementById('overlayIcon').textContent = '⚠️';
  document.getElementById('overlayName').textContent = 'お渡し済みのカードです';
  document.getElementById('overlayCompany').textContent =
    (v.company || '') + '　' + (v.name || '') + ' 様';
  document.getElementById('overlayMessage').textContent =
    'この方は受付が済んでいます。もう一度受付する必要はありません。';
  document.getElementById('overlayTime').textContent = '';
  hideAllOverlayBlocks();

  const cardBox = document.getElementById('overlayCardNo');
  cardBox.innerHTML = '<span class="card-no-badge">🎫 カード No.' + escapeHtml(cardNo) + '</span>';
  cardBox.style.display = 'block';

  document.getElementById('overlayNext').style.display = 'block';
  playSound('duplicate');
}

function showOverlayResult(result) {
  const ov = document.getElementById('overlay');
  hideAllOverlayBlocks();
  document.getElementById('overlayNext').style.display = 'block';

  if (!result.success) {
    ov.className = 'overlay error show';
    document.getElementById('overlayIcon').textContent = '❌';
    document.getElementById('overlayName').textContent = '受付できませんでした';
    document.getElementById('overlayCompany').textContent = '';
    document.getElementById('overlayMessage').textContent = result.message || result.error || 'エラーが発生しました';
    document.getElementById('overlayTime').textContent = '';
    playSound(false);
    return;
  }

  const v = result.visitor;
  document.getElementById('overlayName').textContent = v.name;
  document.getElementById('overlayCompany').textContent =
    v.company + (v.department ? '　' + v.department : '');
  document.getElementById('overlayTime').textContent =
    '受付時刻：' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

  // ★ 仮カードを渡した場合は、カード番号を大きく出す（渡し間違い防止）
  const cardBox = document.getElementById('overlayCardNo');
  if (assignedCardNo) {
    cardBox.innerHTML = '<span class="card-no-badge">🎫 カード No.' + escapeHtml(assignedCardNo) + ' をお渡しください</span>';
    cardBox.style.display = 'block';
  }

  if (result.duplicate) {
    ov.className = 'overlay duplicate show';
    document.getElementById('overlayIcon').textContent = '⚠️';
    document.getElementById('overlayMessage').textContent = '本日すでに受付済みです';
    playSound('duplicate');
  } else {
    ov.className = 'overlay success show';
    document.getElementById('overlayIcon').textContent = '✅';
    document.getElementById('overlayMessage').textContent = 'ようこそ！受付完了しました';
    playSound(true);
  }
}

function showOverlayError(title, sub) {
  const ov = document.getElementById('overlay');
  ov.className = 'overlay error show';
  document.getElementById('overlayIcon').textContent = '❌';
  document.getElementById('overlayName').textContent = title;
  document.getElementById('overlayCompany').textContent = sub;
  document.getElementById('overlayMessage').textContent = '';
  document.getElementById('overlayTime').textContent = '';
  hideAllOverlayBlocks();
  document.getElementById('overlayNext').style.display = 'block';
}

function hideOverlay() {
  document.getElementById('overlay').className = 'overlay';
  hideAllOverlayBlocks();
}

// ============================================================
// ★ 仮カードの割り当て
//   ①「仮カードを渡して受付」を押す
//   ② カードのQRをスキャン（読めなければIDを手入力）
//   ③ 割り当て → そのまま受付完了
// ============================================================
function beginAssign() {
  if (!currentVisitor) return;
  touchActivity();

  assignTarget = currentVisitor;
  assignMode = true;
  assignedCardNo = null;
  document.getElementById('assignCardInput').value = '';

  showAssignBar();

  if (isScanning && html5QrCode) {
    try { html5QrCode.resume(); } catch(e) {}
    scanPaused = false;
    setStatus('assign', '仮カードをスキャン');
  } else {
    startCamera();
  }
}

// ★ カメラ映像を隠さずに、下の帯で案内する
function showAssignBar(errorMessage) {
  hideOverlay();                                   // オレンジの画面を消してカメラを見せる
  document.getElementById('cameraGuide').style.display = 'none';
  document.getElementById('assignBar').style.display = 'block';
  document.getElementById('assignBarName').textContent = (assignTarget.name || '') + ' 様';
  document.getElementById('assignBarCompany').textContent = assignTarget.company || '';

  const err = document.getElementById('assignBarError');
  if (errorMessage) { err.textContent = errorMessage; err.style.display = 'block'; }
  else              { err.textContent = ''; err.style.display = 'none'; }
}

function hideAssignBar() {
  document.getElementById('assignBar').style.display = 'none';
  document.getElementById('cameraGuide').style.display = 'block';
}

function submitAssignCard() {
  const val = document.getElementById('assignCardInput').value.trim().toUpperCase();
  if (!val) { showToast('カードのIDを入力してください'); return; }
  handleCardScan(val);
}

function cancelAssign() {
  assignMode = false;
  assignTarget = null;
  hideAssignBar();
  if (currentVisitor) {
    scanPaused = true;
    if (html5QrCode && isScanning) { try { html5QrCode.pause(true); } catch(e) {} }
    setStatus('paused', '確認中...');
    showOverlayPreview(currentVisitor);
  } else {
    resetScan();
  }
}

function handleCardScan(cardId) {
  if (!assignTarget) { resetScan(); return; }

  if (cardId === assignTarget.id) {
    showToast('同じQRです。仮カードのQRをスキャンしてください');
    return;
  }

  assignMode = false;
  scanPaused = true;
  if (html5QrCode && isScanning) { try { html5QrCode.pause(true); } catch(e) {} }
  setStatus('paused', '確認中...');
  hideAssignBar();
  showOverlayLoading();

  const url = withKey(GAS_URL + '?action=assignCard'
    + '&visitorId=' + encodeURIComponent(assignTarget.id)
    + '&cardId='    + encodeURIComponent(cardId))
    + '&operator='  + encodeURIComponent(OPERATOR);

  fetchJsonWithRetry(url)
    .then(data => {
      if (!data.success) {
        // 失敗しても、もう一度カードを読み直せるように戻す
        assignMode = true;
        showAssignBar(data.message || data.error || '割り当てできませんでした');
        if (html5QrCode && isScanning) { try { html5QrCode.resume(); } catch(e) {} scanPaused = false; }
        setStatus('assign', '仮カードをスキャン');
        playSound(false);
        return;
      }
      assignedCardNo = data.cardNo;
      lastScannedId  = assignTarget.id;   // 受付は「本人のID」で記録する
      confirmCheckin();
    })
    .catch(() => {
      assignMode = true;
      showAssignBar('通信エラー。もう一度スキャンしてください');
      if (html5QrCode && isScanning) { try { html5QrCode.resume(); } catch(e) {} scanPaused = false; }
      setStatus('assign', '仮カードをスキャン');
    });
}

// ============================================================
// 受付確定・キャンセル・リセット
// ============================================================
function confirmCheckin() {
  if (!lastScannedId) return;
  touchActivity();
  hideAllOverlayBlocks();
  showOverlayLoading();

  // ★ 受付方法（QR/検索）と担当者名も一緒に記録する
  const url = withKey(GAS_URL + '?action=checkin&visitorId=' + encodeURIComponent(lastScannedId))
    + '&method=' + encodeURIComponent(assignedCardNo ? '検索＋仮カード' : lastScanMethod)
    + '&operator=' + encodeURIComponent(OPERATOR);

  fetchJsonWithRetry(url)
    .then(data => {
      showOverlayResult(data);
      loadCheckins();
    })
    .catch(() => {
      showOverlayResult({ success: false, error: '通信エラーが発生しました' });
    });
}

function cancelCheckin() {
  lastScannedId = null;
  resetScan();
}

function resetScan() {
  hideOverlay();
  hideAssignBar();
  lastScannedId = null;
  scanCooldown = false;
  scanPaused = false;

  currentVisitor = null;
  assignMode = false;
  assignTarget = null;
  assignedCardNo = null;

  if (html5QrCode && isScanning) {
    try { html5QrCode.resume(); } catch(e) {}
    setStatus('scanning', 'スキャン待機中');
  } else {
    // カメラ未起動なら枠を閉じてスタートボタンを戻す
    document.getElementById('cameraWrap').classList.remove('active');
    document.getElementById('startBtn').style.display = 'flex';
  }
}

// ============================================================
// 手動入力
// ============================================================
function manualCheckin() {
  const q = document.getElementById('manualId').value.trim();
  if (!q) { showToast('お名前・会社名・IDを入力してください'); return; }
  touchActivity();

  // 来場者ID形式（V-XXXXXX）ならそのまま受付フローへ
  if (/^V-[A-Z0-9]{4,}$/i.test(q)) {
    document.getElementById('manualId').value = '';
    document.getElementById('searchResults').innerHTML = '';
    startManualFlow(q.toUpperCase());
    return;
  }

  // それ以外は名前・会社名・ID（表記ゆらぎOK）で検索して候補を表示
  const box = document.getElementById('searchResults');
  box.innerHTML = '<div class="search-hint">検索中...</div>';
  fetchJsonWithRetry(withKey(GAS_URL + '?action=searchVisitors&q=' + encodeURIComponent(q)))
    .then(data => {
      if (!data.success) {
        box.innerHTML = '<div class="search-hint">エラー：' + (data.message || data.error || '') + '</div>';
        return;
      }
      if (!data.results || data.results.length === 0) {
        box.innerHTML = '<div class="search-hint">該当する登録が見つかりませんでした。文字を変えてお試しください</div>';
        return;
      }
      box.innerHTML = data.results.map(v =>
        '<button class="search-result" onclick="selectSearchResult(\'' + v.id + '\')">'
        + '<span class="sr-name">' + escapeHtml(v.name) + '</span>'
        + '<span class="sr-company">' + escapeHtml(v.company) + (v.department ? '　' + escapeHtml(v.department) : '') + '</span>'
        + '<span class="sr-id">' + escapeHtml(v.id) + '</span>'
        + '</button>').join('')
        + (data.truncated ? '<div class="search-hint">候補が多いため10件まで表示しています。文字を増やすと絞り込めます</div>' : '');
    })
    .catch(() => {
      box.innerHTML = '<div class="search-hint">通信エラー。もう一度お試しください</div>';
    });
}

function selectSearchResult(id) {
  document.getElementById('manualId').value = '';
  document.getElementById('searchResults').innerHTML = '';
  startManualFlow(id);
}

function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function startManualFlow(id) {
  lastScannedId = id;
  lastScanMethod = '検索';
  scanPaused = true;
  assignMode = false;
  assignedCardNo = null;

  if (isScanning) {
    if (html5QrCode) { try { html5QrCode.pause(true); } catch(e) {} }
    setStatus('paused', '確認中...');
    showOverlayLoading();
    document.getElementById('cameraGuide').style.display = 'none';
  } else {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('cameraWrap').classList.add('active');
    showOverlayLoading();
  }

  fetchJsonWithRetry(withKey(GAS_URL + '?action=getVisitorInfo&visitorId=' + encodeURIComponent(id)))
    .then(data => {
      if (!data.success) { showOverlayError('来場者が見つかりません', 'ID: ' + id); return; }
      showOverlayPreview(data.visitor);
    })
    .catch(() => { showOverlayError('通信エラー', 'インターネット接続を確認してください'); });
}

// ============================================================
// 受付ログ
// ============================================================
function loadCheckins() {
  fetchJsonWithRetry(withKey(GAS_URL + '?action=getCheckins'))
    .then(result => {
      const list = document.getElementById('logList');
      const data = (result.data || []).slice().reverse();
      document.getElementById('logCount').textContent = data.length + '名';
      document.getElementById('checkinCountBadge').textContent = '本日 ' + data.length + '名';
      if (data.length === 0) {
        list.innerHTML = '<div class="log-empty">まだ受付記録がありません</div>';
        return;
      }
      list.innerHTML = data.map(c => {
        const time = c.checked_in_at
          ? new Date(c.checked_in_at).toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit'})
          : '--:--';
        return '<div class="log-item">'
          + '<div class="log-time">' + time + '</div>'
          + '<div class="log-info">'
          + '<div class="log-name">' + (c.visitor_name||'不明') + '</div>'
          + '<div class="log-company">' + (c.visitor_company||'') + '</div>'
          + '</div>'
          + '<div class="log-badge">受付済</div>'
          + '</div>';
      }).join('');
    }).catch(function(){});
}

// ============================================================
// 音声・トースト
// ============================================================
function playSound(type) {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.value = 0.3;
    if (type===true){osc.frequency.value=880;osc.start();osc.stop(ctx.currentTime+0.12);}
    else if(type==='duplicate'){osc.frequency.value=440;osc.start();osc.stop(ctx.currentTime+0.2);}
    else{osc.frequency.value=220;osc.start();osc.stop(ctx.currentTime+0.3);}
  } catch(e){}
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============================================================
// スタッフ認証（合言葉＋担当者名）
// ============================================================
function showLock(msg) {
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('lockError').textContent = msg || '';
  if (OPERATOR) document.getElementById('operatorInput').value = OPERATOR;
}
function hideLock() {
  document.getElementById('lockScreen').style.display = 'none';
}
function submitStaffKey() {
  const key = document.getElementById('staffKeyInput').value.trim();
  const op  = document.getElementById('operatorInput').value.trim();
  if (!key) { document.getElementById('lockError').textContent = '合言葉を入力してください'; return; }
  if (!op)  { document.getElementById('lockError').textContent = '担当者名（または端末名）を入力してください'; return; }
  STAFF_KEY = key;
  OPERATOR  = op;
  document.getElementById('lockError').textContent = '確認中...';
  fetchJsonWithRetry(withKey(GAS_URL + '?action=getCheckins'))
    .then(data => {
      if (data.success) {
        localStorage.setItem('staffKey', STAFF_KEY);
        localStorage.setItem('staffOperator', OPERATOR);
        localStorage.setItem('staffAuthDay', todayString());
        localStorage.setItem('staffLastActive', String(Date.now()));
        hideLock();
        startApp();
      } else {
        STAFF_KEY = '';
        document.getElementById('lockError').textContent = '合言葉が違います';
      }
    })
    .catch(() => {
      document.getElementById('lockError').textContent = '通信エラー。接続を確認してください';
    });
}
function startApp() {
  document.getElementById('operatorNameLabel').textContent = OPERATOR;
  document.getElementById('operatorBar').style.display = 'flex';
  loadCheckins();
  if (!window._logTimer) window._logTimer = setInterval(loadCheckins, 30000);
}

// ============================================================
// 起動時：記憶済みの合言葉があり、有効期限内なら自動認証
// ============================================================
window.onload = function() {
  if (!STAFF_KEY || !OPERATOR || isAuthExpired()) {
    logoutSilent();
    showLock('');
    return;
  }
  fetchJsonWithRetry(withKey(GAS_URL + '?action=getCheckins'))
    .then(data => {
      if (data.success) {
        localStorage.setItem('staffLastActive', String(Date.now()));
        hideLock();
        startApp();
      }
      else { STAFF_KEY = ''; localStorage.removeItem('staffKey'); showLock('合言葉を再入力してください'); }
    })
    .catch(() => showLock('通信エラー。接続を確認して再入力してください'));
};

// 起動時の失効処理（メッセージを出さずに片付けるだけ）
function logoutSilent() {
  STAFF_KEY = '';
  localStorage.removeItem('staffKey');
  localStorage.removeItem('staffAuthDay');
  localStorage.removeItem('staffLastActive');
}
</script>
